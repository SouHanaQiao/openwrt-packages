name: Repair priority package groups

on:
  workflow_dispatch:
    inputs:
      original_run_id:
        description: Full build run ID containing the original package shards
        required: true
        type: string

concurrency:
  group: openwrt-package-pages
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Repair OpenWrt ${{ matrix.channel }} ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - channel: "25.12"
            group: smartdns
            package_dirs: smartdns luci-app-smartdns
          - channel: "25.12"
            group: adguardhome
            package_dirs: adguardhome luci-app-adguardhome
          - channel: "24.10"
            group: smartdns
            package_dirs: smartdns luci-app-smartdns
          - channel: "24.10"
            group: adguardhome
            package_dirs: adguardhome luci-app-adguardhome

    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.channel == '25.12' && 'main' || 'openwrt-24.10' }}

      - name: Set up Go bootstrap
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Validate feed
        run: bash scripts/validate-feed.sh

      - name: Build repaired package group
        env:
          OPENWRT_VERSION: ${{ matrix.channel == '25.12' && '25.12.5' || '24.10.1' }}
          CHANNEL: ${{ matrix.channel }}
          SDK_URL: ${{ matrix.channel == '25.12' && 'https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst' || 'https://downloads.openwrt.org/releases/24.10.1/targets/armsr/armv8/openwrt-sdk-24.10.1-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst' }}
          SDK_SHA256: ${{ matrix.channel == '25.12' && '1b0316604a3e820b2b008a1baff3f9dac6716af942bef800930e58c7de98c98b' || 'c9a8eb4072b63cda0037728c39e8d460c6f12590e42cad57003836f1d2974434' }}
          OPENWRT_REF: ${{ matrix.channel == '25.12' && 'f0a60eee2fe051741c643ea6118718aae1ef17fb' || 'd183d7bb7827a469f09bf77f2f22fd9d70ac0ed6' }}
          FEEDS_BUILDINFO_URL: ${{ matrix.channel == '25.12' && 'https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/feeds.buildinfo' || 'https://downloads.openwrt.org/releases/24.10.1/targets/armsr/armv8/feeds.buildinfo' }}
          PACKAGE_FORMAT: ${{ matrix.channel == '25.12' && 'apk' || 'ipk' }}
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          OPKG_PRIVATE_KEY: ${{ secrets.OPKG_PRIVATE_KEY }}
          BUILD_JOBS: "2"
          SHARD_INDEX: "0"
          SHARD_COUNT: "2"
          PACKAGE_DIRS: ${{ matrix.package_dirs }}
          REPORT_NAME: repair-${{ matrix.group }}
        run: bash scripts/build-feed.sh

      - name: Upload repaired package group
        uses: actions/upload-artifact@v4
        with:
          name: repair-${{ matrix.channel }}-${{ matrix.group }}
          path: shard-output/
          if-no-files-found: error
          retention-days: 2

  finalize:
    name: Merge repaired OpenWrt ${{ matrix.channel }} feed
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        channel: ["25.12", "24.10"]
    steps:
      - name: Check out signing scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.channel == '25.12' && 'main' || 'openwrt-24.10' }}

      - name: Install index dependencies
        run: sudo apt-get update && sudo apt-get install --yes zstd

      - name: Download original package shards
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.original_run_id }}
          pattern: packages-${{ matrix.channel }}-*
          path: shard-output
          merge-multiple: true

      - name: Merge repaired package groups
        uses: actions/download-artifact@v4
        with:
          pattern: repair-${{ matrix.channel }}-*
          path: shard-output
          merge-multiple: true

      - name: Generate signed package index
        env:
          OPENWRT_VERSION: ${{ matrix.channel == '25.12' && '25.12.5' || '24.10.1' }}
          CHANNEL: ${{ matrix.channel }}
          SDK_URL: ${{ matrix.channel == '25.12' && 'https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst' || 'https://downloads.openwrt.org/releases/24.10.1/targets/armsr/armv8/openwrt-sdk-24.10.1-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst' }}
          SDK_SHA256: ${{ matrix.channel == '25.12' && '1b0316604a3e820b2b008a1baff3f9dac6716af942bef800930e58c7de98c98b' || 'c9a8eb4072b63cda0037728c39e8d460c6f12590e42cad57003836f1d2974434' }}
          PACKAGE_FORMAT: ${{ matrix.channel == '25.12' && 'apk' || 'ipk' }}
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          OPKG_PRIVATE_KEY: ${{ secrets.OPKG_PRIVATE_KEY }}
        run: bash scripts/finalize-feed.sh

      - name: Upload repaired signed feed
        uses: actions/upload-artifact@v4
        with:
          name: priority-feed-${{ matrix.channel }}
          path: site/
          if-no-files-found: error

  deploy:
    name: Deploy repaired package repository
    needs: finalize
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Merge version feeds
        uses: actions/download-artifact@v4
        with:
          pattern: priority-feed-*
          path: site
          merge-multiple: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
