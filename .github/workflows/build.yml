name: Build OpenWrt package feeds

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - openwrt-24.10

concurrency:
  group: openwrt-package-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: OpenWrt ${{ matrix.channel }} shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        channel: ["25.12", "24.10"]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Check out package branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.channel == '25.12' && 'main' || 'openwrt-24.10' }}

      - name: Set up Go bootstrap
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Validate feed
        run: bash scripts/validate-feed.sh

      - name: Build package shard
        env:
          OPENWRT_VERSION: ${{ matrix.channel == '25.12' && '25.12.5' || '24.10.1' }}
          CHANNEL: ${{ matrix.channel }}
          SDK_URL: ${{ matrix.channel == '25.12' && 'https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst' || 'https://downloads.openwrt.org/releases/24.10.1/targets/armsr/armv8/openwrt-sdk-24.10.1-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst' }}
          SDK_SHA256: ${{ matrix.channel == '25.12' && '1b0316604a3e820b2b008a1baff3f9dac6716af942bef800930e58c7de98c98b' || 'c9a8eb4072b63cda0037728c39e8d460c6f12590e42cad57003836f1d2974434' }}
          OPENWRT_REF: ${{ matrix.channel == '25.12' && 'f0a60eee2fe051741c643ea6118718aae1ef17fb' || 'd183d7bb7827a469f09bf77f2f22fd9d70ac0ed6' }}
          FEEDS_BUILDINFO_URL: ${{ matrix.channel == '25.12' && 'https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/feeds.buildinfo' || 'https://downloads.openwrt.org/releases/24.10.1/targets/armsr/armv8/feeds.buildinfo' }}
          PACKAGE_FORMAT: ${{ matrix.channel == '25.12' && 'apk' || 'ipk' }}
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          OPKG_PRIVATE_KEY: ${{ secrets.OPKG_PRIVATE_KEY }}
          BUILD_JOBS: "2"
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: "8"
        run: bash scripts/build-feed.sh

      - name: Upload package shard
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.channel }}-${{ matrix.shard }}
          path: shard-output/
          if-no-files-found: error
          retention-days: 2

  finalize:
    name: Finalize OpenWrt ${{ matrix.channel }} feed
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        channel: ["25.12", "24.10"]
    steps:
      - name: Check out signing scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.channel == '25.12' && 'main' || 'openwrt-24.10' }}

      - name: Install index dependencies
        run: sudo apt-get update && sudo apt-get install --yes zstd

      - name: Merge package shards
        uses: actions/download-artifact@v4
        with:
          pattern: packages-${{ matrix.channel }}-*
          path: shard-output
          merge-multiple: true

      - name: Generate signed package index
        env:
          OPENWRT_VERSION: ${{ matrix.channel == '25.12' && '25.12.5' || '24.10.1' }}
          CHANNEL: ${{ matrix.channel }}
          SDK_URL: ${{ matrix.channel == '25.12' && 'https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-sdk-25.12.5-armsr-armv8_gcc-14.3.0_musl.Linux-x86_64.tar.zst' || 'https://downloads.openwrt.org/releases/24.10.1/targets/armsr/armv8/openwrt-sdk-24.10.1-armsr-armv8_gcc-13.3.0_musl.Linux-x86_64.tar.zst' }}
          SDK_SHA256: ${{ matrix.channel == '25.12' && '1b0316604a3e820b2b008a1baff3f9dac6716af942bef800930e58c7de98c98b' || 'c9a8eb4072b63cda0037728c39e8d460c6f12590e42cad57003836f1d2974434' }}
          PACKAGE_FORMAT: ${{ matrix.channel == '25.12' && 'apk' || 'ipk' }}
          APK_PRIVATE_KEY: ${{ secrets.APK_PRIVATE_KEY }}
          OPKG_PRIVATE_KEY: ${{ secrets.OPKG_PRIVATE_KEY }}
        run: bash scripts/finalize-feed.sh

      - name: Upload signed version feed
        uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.channel }}
          path: site/
          if-no-files-found: error

  deploy:
    name: Deploy package repository
    needs: finalize
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Merge version feeds
        uses: actions/download-artifact@v4
        with:
          pattern: feed-*
          path: site
          merge-multiple: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
